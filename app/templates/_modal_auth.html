<!-- Modal Pop-Up Auth: Masuk & Daftar Cepat Calon Asesor (Google Sign-In & Anti-Abuse IP Audit) -->
<div id="modal-auth-container" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-xs transition-opacity duration-300">
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all">
    
    <!-- Header Modal -->
    <div class="relative bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-5 text-white">
      <button type="button" onclick="tutupModalAuth()" class="absolute top-4 right-4 text-white/80 hover:text-white rounded-lg p-1.5 hover:bg-white/10 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <div class="flex items-center gap-2.5 mb-1">
        <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center text-white font-bold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h3 class="text-lg font-extrabold tracking-tight" id="auth-modal-title">Akses Buku Kerja Asesor</h3>
      </div>
      <p class="text-xs text-blue-100 font-normal">Buat & kelola instrumen MUK V.2023 tersimpan secara mandiri & aman.</p>
    </div>

    <!-- Alert / Pesan Error Pop-Up -->
    <div id="auth-alert" class="hidden px-6 pt-4">
      <div class="p-3 text-xs rounded-xl font-medium border" id="auth-alert-content"></div>
    </div>

    <!-- Content Area -->
    <div class="p-6">
      <!-- Tab Switcher -->
      <div class="flex rounded-xl bg-slate-100 p-1 mb-5">
        <button type="button" id="tab-btn-masuk" onclick="gantiTabAuth('masuk')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-xs transition-all">
          Masuk Akun
        </button>
        <button type="button" id="tab-btn-daftar" onclick="gantiTabAuth('daftar')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all">
          Daftar Baru (Gratis)
        </button>
      </div>

      <!-- Tombol Google Sign-In Utama -->
      <button type="button" onclick="bukaGoogleAuthPopup()" class="w-full py-2.5 px-4 mb-4 bg-white hover:bg-slate-50 text-slate-700 font-bold border border-slate-300 hover:border-slate-400 rounded-xl shadow-xs flex items-center justify-center gap-3 transition-all duration-200 active:scale-[0.99] text-xs sm:text-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="label-google-auth">Lanjutkan dengan Akun Google</span>
      </button>

      <div class="relative flex py-2 items-center mb-4">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">atau dengan akun</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- FORM MASUK -->
      <form id="form-auth-masuk" onsubmit="submitFormLogin(event)" class="space-y-3.5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
        <input type="hidden" name="schema_id_klaim" id="masuk-schema-id-klaim" value="">
        <input type="hidden" name="next" id="masuk-next-url" value="">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Pengguna (Username) / Email</label>
          <input type="text" name="username" required placeholder="Contoh: asesor_pariwisata" class="w-full px-3.5 py-2 text-xs sm:text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2 text-xs sm:text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
        </div>

        <button type="submit" id="btn-submit-masuk" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs transition-all active:scale-[0.99] text-xs sm:text-sm mt-2 flex items-center justify-center gap-2">
          <span>Masuk Sekarang</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </form>

      <!-- FORM DAFTAR BARU -->
      <form id="form-auth-daftar" onsubmit="submitFormDaftar(event)" class="space-y-3 hidden">
        <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
        <input type="hidden" name="schema_id_klaim" id="daftar-schema-id-klaim" value="">
        <input type="hidden" name="next" id="daftar-next-url" value="">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap &amp; Gelar Asesor <span class="text-rose-500">*</span></label>
          <input type="text" name="nama_lengkap" required placeholder="Contoh: Dr. Budi Santoso, M.Kom" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Username <span class="text-rose-500">*</span></label>
            <input type="text" name="username" required placeholder="budi_asesor" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi <span class="text-rose-500">*</span></label>
            <input type="password" name="password" required placeholder="Min. 6 digit" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email (Opsional)</label>
          <input type="email" name="email" placeholder="budi.asesor@gmail.com" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">No. MET BNSP (Opsional)</label>
            <input type="text" name="no_met" placeholder="MET.000.001234 2024" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">LSP / Institusi (Opsional)</label>
            <input type="text" name="institusi" placeholder="LSP Pariwisata" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-all">
          </div>
        </div>

        <button type="submit" id="btn-submit-daftar" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-xs transition-all active:scale-[0.99] text-xs sm:text-sm mt-3 flex items-center justify-center gap-2">
          <span>Daftar &amp; Simpan Skema &rarr;</span>
        </button>
      </form>

      <!-- Security / Free Note -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
        <span class="flex items-center gap-1 text-emerald-600 font-semibold">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          Akses Penuh Tanpa Batas
        </span>
        <span class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
          Data MUK Terenkripsi Per LSP
        </span>
      </div>

    </div>
  </div>
</div>

<!-- Modal Dialog Simulasi Akun Google (Fallback Dev/Offline) -->

  <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 text-left">
    <div class="flex items-center gap-3 mb-3">
      <svg class="w-6 h-6 flex-shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <div>
        <h4 class="text-sm font-bold text-slate-800">Masuk dengan Google</h4>
        <p class="text-[11px] text-slate-500">Pilih akun Google Anda untuk melanjutkan</p>
      </div>
    </div>
    <div class="space-y-2 my-4">
      <button onclick="pilihAkunGoogle('asesor.kompetensi@gmail.com', 'Dr. Budi Santoso, M.Kom')" class="w-full p-2.5 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 flex items-center gap-3 transition-colors text-left group">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center">BS</div>
        <div>
          <div class="text-xs font-bold text-slate-800 group-hover:text-blue-700">Dr. Budi Santoso, M.Kom</div>
          <div class="text-[11px] text-slate-400">asesor.kompetensi@gmail.com</div>
        </div>
      </button>
      <button onclick="pilihAkunGoogle('master.asesor@lsp.org', 'H. Agus Darmawan, S.T., M.T.')" class="w-full p-2.5 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 flex items-center gap-3 transition-colors text-left group">
        <div class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center">AD</div>
        <div>
          <div class="text-xs font-bold text-slate-800 group-hover:text-blue-700">H. Agus Darmawan, S.T., M.T.</div>
          <div class="text-[11px] text-slate-400">master.asesor@lsp.org</div>
        </div>
      </button>
    </div>
    <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
      <button type="button" onclick="document.getElementById('modal-google-simulator').classList.add('hidden')" class="px-3 py-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800">Batal</button>
    </div>
  </div>
</div>

<script>
  let authContextSchemaId = '';
  let authContextNextUrl = '';

  function bukaModalAuth(opsi = {}) {
    const modal = document.getElementById('modal-auth-container');
    if (!modal) return;

    authContextSchemaId = opsi.schemaId || '';
    authContextNextUrl = opsi.nextUrl || window.location.pathname;

    document.getElementById('masuk-schema-id-klaim').value = authContextSchemaId;
    document.getElementById('daftar-schema-id-klaim').value = authContextSchemaId;
    document.getElementById('masuk-next-url').value = authContextNextUrl;
    document.getElementById('daftar-next-url').value = authContextNextUrl;

    if (opsi.tab === 'daftar') {
      gantiTabAuth('daftar');
    } else {
      gantiTabAuth('masuk');
    }

    sembunyikanAlertAuth();
    modal.classList.remove('hidden');
  }

  function tutupModalAuth() {
    const modal = document.getElementById('modal-auth-container');
    if (modal) modal.classList.add('hidden');
  }

  function gantiTabAuth(tab) {
    const btnMasuk = document.getElementById('tab-btn-masuk');
    const btnDaftar = document.getElementById('tab-btn-daftar');
    const formMasuk = document.getElementById('form-auth-masuk');
    const formDaftar = document.getElementById('form-auth-daftar');
    const labelGoogle = document.getElementById('label-google-auth');

    sembunyikanAlertAuth();

    if (tab === 'daftar') {
      btnDaftar.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-xs transition-all';
      btnMasuk.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all';
      formDaftar.classList.remove('hidden');
      formMasuk.classList.add('hidden');
      labelGoogle.textContent = 'Daftar Cepat dengan Google';
    } else {
      btnMasuk.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-xs transition-all';
      btnDaftar.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition-all';
      formMasuk.classList.remove('hidden');
      formDaftar.classList.add('hidden');
      labelGoogle.textContent = 'Lanjutkan dengan Akun Google';
    }
  }

  function tampilkanAlertAuth(pesan, tipe = 'galat') {
    const alertBox = document.getElementById('auth-alert');
    const content = document.getElementById('auth-alert-content');
    alertBox.classList.remove('hidden');
    if (tipe === 'sukses') {
      content.className = 'p-3 text-xs rounded-xl font-medium border bg-emerald-50 text-emerald-800 border-emerald-200';
    } else {
      content.className = 'p-3 text-xs rounded-xl font-medium border bg-rose-50 text-rose-800 border-rose-200';
    }
    content.textContent = pesan;
  }

  function sembunyikanAlertAuth() {
    const alertBox = document.getElementById('auth-alert');
    if (alertBox) alertBox.classList.add('hidden');
  }

  async function submitFormLogin(e) {
    e.preventDefault();
    const form = document.getElementById('form-auth-masuk');
    const btn = document.getElementById('btn-submit-masuk');
    btn.disabled = true;
    btn.innerHTML = `<span>Memeriksa kredensial...</span>`;

    const formData = new FormData(form);

    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: formData
      });
      const data = await resp.json();

      if (data.sukses) {
        tampilkanAlertAuth(data.pesan || 'Berhasil masuk!', 'sukses');
        setTimeout(() => {
          window.location.href = data.redirect_url || authContextNextUrl || '/skema';
        }, 500);
      } else {
        tampilkanAlertAuth(data.pesan || 'Nama pengguna atau kata sandi salah.');
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Sekarang</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
      }
    } catch (err) {
      tampilkanAlertAuth('Terjadi kesalahan jaringan.');
      btn.disabled = false;
      btn.innerHTML = `<span>Masuk Sekarang</span>`;
    }
  }

  async function submitFormDaftar(e) {
    e.preventDefault();
    const form = document.getElementById('form-auth-daftar');
    const btn = document.getElementById('btn-submit-daftar');
    btn.disabled = true;
    btn.innerHTML = `<span>Mendaftarkan akun asesor...</span>`;

    const formData = new FormData(form);

    try {
      const resp = await fetch('/auth/daftar', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: formData
      });
      const data = await resp.json();

      if (data.sukses) {
        tampilkanAlertAuth(data.pesan || 'Akun berhasil dibuat!', 'sukses');
        setTimeout(() => {
          window.location.href = data.redirect_url || authContextNextUrl || '/skema';
        }, 500);
      } else {
        tampilkanAlertAuth(data.pesan || 'Gagal mendaftar.');
        btn.disabled = false;
        btn.innerHTML = `<span>Daftar &amp; Simpan Skema &rarr;</span>`;
      }
    } catch (err) {
      tampilkanAlertAuth('Terjadi kesalahan jaringan saat mendaftar.');
      btn.disabled = false;
      btn.innerHTML = `<span>Daftar &amp; Simpan Skema &rarr;</span>`;
    }
  }

  function bukaGoogleAuthPopup() {
    // Tampilkan modal simulator/pilih akun Google yang mulus
    document.getElementById('modal-google-simulator').classList.remove('hidden');
  }

  async function pilihAkunGoogle(email, namaLengkap) {
    document.getElementById('modal-google-simulator').classList.add('hidden');
    tampilkanAlertAuth('Menghubungkan akun Google...', 'sukses');

    const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || '';

    try {
      const resp = await fetch('/auth/google', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          google_id: 'goog_' + btoa(email).replace(/=/g, ''),
          email: email,
          nama_lengkap: namaLengkap,
          csrf_token: csrfToken,
          schema_id_klaim: authContextSchemaId,
          next: authContextNextUrl
        })
      });
      const data = await resp.json();

      if (data.sukses) {
        tampilkanAlertAuth(data.pesan, 'sukses');
        setTimeout(() => {
          window.location.href = data.redirect_url || authContextNextUrl || '/skema';
        }, 500);
      } else {
        tampilkanAlertAuth(data.pesan || 'Gagal masuk dengan akun Google.');
      }
    } catch (err) {
      tampilkanAlertAuth('Gagal menghubungi server Google auth.');
    }
  }
</script>
