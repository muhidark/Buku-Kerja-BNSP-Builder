name: CI Test Suite

on:
  push:
    branches: [ main, audit-fixes ]
  pull_request:
    branches: [ main, audit-fixes ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint check with ruff
        run: |
          ruff check app/ tests/ || true

      - name: Run fast & security test suite (pytest)
        run: |
          pytest tests/test_versi_muk.py tests/test_otorisasi.py tests/test_openapi.py tests/test_struktur_kode.py tests/test_fase1_auth_db.py tests/test_migrasi_cadangan.py tests/test_cache_berkas.py
